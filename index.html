<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Responsive Calculator</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --calc-bg: #1e222b;
            --screen-bg: #0f1115;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --btn-number: #2d323f;
            --btn-number-hover: #3d4456;
            --btn-operator: #ff9f0a;
            --btn-operator-hover: #cc7f08;
            --btn-utility: #4e5567;
            --btn-utility-hover: #616a80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 360px;
            background-color: var(--calc-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .screen {
            background-color: var(--screen-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            min-height: 110px;
            overflow: hidden;
        }

        .previous-operand {
            color: var(--text-muted);
            font-size: 1.1rem;
            min-height: 1.5rem;
            word-wrap: break-word;
            word-break: break-all;
            text-align: right;
            margin-bottom: 4px;
        }

        .current-operand {
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 500;
            word-wrap: break-word;
            word-break: break-all;
            text-align: right;
            line-height: 1.2;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.15s ease, transform 0.05s ease;
            user-select: none;
        }

        button:active {
            transform: scale(0.95);
        }

        .number {
            background-color: var(--btn-number);
            color: var(--text-main);
        }

        .number:hover {
            background-color: var(--btn-number-hover);
        }

        .operator {
            background-color: var(--btn-operator);
            color: white;
        }

        .operator:hover {
            background-color: var(--btn-operator-hover);
        }

        .utility {
            background-color: var(--btn-utility);
            color: var(--text-main);
        }

        .utility:hover {
            background-color: var(--btn-utility-hover);
        }

        .span-two {
            grid-column: span 2;
            aspect-ratio: auto;
            height: 100%;
        }

        /* Mobile Optimization */
        @media (max-width: 400px) {
            .calculator {
                padding: 16px;
                border-radius: 20px;
            }
            
            .buttons-grid {
                gap: 8px;
            }

            button {
                border-radius: 12px;
                font-size: 1.35rem;
            }

            .current-operand {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="screen">
            <div id="previous-operand" class="previous-operand"></div>
            <div id="current-operand" class="current-operand">0</div>
        </div>
        <div class="buttons-grid">
            <button class="utility span-two" onclick="clearScreen()">C</button>
            <button class="utility" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="chooseOperator('÷')">÷</button>

            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('×')">×</button>

            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('−')">−</button>

            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="number span-two" onclick="appendNumber('0')">0</button>
            <button class="number" onclick="appendDecimal()">.</button>
            <button class="operator" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        const currentDisplay = document.getElementById('current-operand');
        const previousDisplay = document.getElementById('previous-operand');
        
        let currentInput = '0';
        let previousInput = '';
        let operation = undefined;
        let shouldResetDisplay = false;

        function updateDisplay() {
            currentDisplay.innerText = currentInput;
            if (operation != null) {
                previousDisplay.innerText = `${previousInput} ${operation}`;
            } else {
                previousDisplay.innerText = '';
            }
        }

        function clearScreen() {
            currentInput = '0';
            previousInput = '';
            operation = undefined;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput === 'Error: Div by 0' || currentInput === 'Error') {
                clearScreen();
                return;
            }
            if (shouldResetDisplay) return;
            if (currentInput.length <= 1) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function appendNumber(number) {
            if (currentInput === 'Error: Div by 0' || currentInput === 'Error') {
                clearScreen();
            }
            if (shouldResetDisplay) {
                currentInput = '';
                shouldResetDisplay = false;
            }
            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            if (currentInput.includes('.')) return;
            currentInput += '.';
            updateDisplay();
        }

        function chooseOperator(selectedOperation) {
            if (currentInput === 'Error: Div by 0' || currentInput === 'Error') return;
            if (operation !== undefined && !shouldResetDisplay) {
                compute();
            }
            operation = selectedOperation;
            previousInput = currentInput;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function compute() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            switch (operation) {
                case '+':
                    result = prev + current;
                    break;
                case '−':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentInput = 'Error: Div by 0';
                        operation = undefined;
                        previousInput = '';
                        shouldResetDisplay = true;
                        updateDisplay();
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }
            
            // Format long floating point numbers dynamically
            currentInput = parseFloat(result.toFixed(8)).toString();
            operation = undefined;
            previousInput = '';
            shouldResetDisplay = true;
            updateDisplay();
        }
    </script>
</body>
</html>
